services:
  muse-ceo:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATA_DIR: /app/data
      PROFILES_DIR: /app/data/profiles
    volumes:
      - muse_boardroom_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  muse_boardroom_data:
