services:
  muse-ceo:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATA_DIR: /app/data
      PROFILES_DIR: /app/data/profiles
    volumes:
      - muse_boardroom_data:/app/data

volumes:
  muse_boardroom_data:
