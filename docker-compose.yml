services:
  muse-ceo:
    build: .
    container_name: muse-ceo-command
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      PROFILES_DIR: /app/data/profiles
    volumes:
      - muse_boardroom_data:/app/data

volumes:
  muse_boardroom_data:
